services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      target: develop
    # GPU passthrough is intentionally omitted for CPU-only development hosts.
    # A local Compose override can add the NVIDIA runtime when available.
    privileged: true
    volumes:
      - ..:/workspaces/zeropoint-agent:cached
      # Host device access for the live hardware-provisioning nodes.
      - /dev:/dev
    # Keep the container alive; the docker-in-docker feature's entrypoint
    # starts dockerd and then execs this.
    command: sleep infinity
