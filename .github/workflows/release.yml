name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build Python release
    runs-on: ubuntu-latest

    steps:
      - name: Check out release revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build PyYAML pytest
          python -m pip install .

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} does not match package version {expected!r}")
          PY

      - name: Run validation
        run: |
          python -m pytest -q
          python -m compileall -q src/zeropoint_agent
          git diff --check

      - name: Build distributions
        run: python -m build

      - name: Generate OpenAPI documents
        run: |
          mkdir -p dist/api
          python - <<'PY'
          import json
          from pathlib import Path

          import yaml

          from zeropoint_agent.server import create_app

          schema = create_app().openapi()
          Path("dist/api/openapi.json").write_text(
              json.dumps(schema, indent=2, sort_keys=True) + "\n"
          )
          Path("dist/api/openapi.yaml").write_text(
              yaml.safe_dump(schema, sort_keys=False)
          )
          PY

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/api/openapi.json
            dist/api/openapi.yaml
